name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.10', '3.12', '3.14']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Test without site packages or Android SDK
        run: python -S -m unittest discover -s tests -v
      - name: Compile Python
        run: python -m compileall -q scripts tests
      - name: Verify native plugin bundle
        run: python -S scripts/build_plugin.py --check
